name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'   # e.g. 1.2.3 (no v prefix)

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write             # required to create GitHub Releases

    steps:
      - uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      # The tag is the source of truth, we do NOT commit the version back
      - name: Update version in package.json
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          jq --arg v "${VERSION}" '.version = $v' package.json > /tmp/_pkg.json \
            && mv /tmp/_pkg.json package.json

      # Same guards as ci.yml: never release a broken or vulnerable build
      - name: Check, test and audit
        run: |
          npm ci
          npm run check
          npm test
          npm audit --omit=dev --audit-level=high

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          # Section "## [X.Y.Z] - date" up to the next "## [" heading
          awk -v v="${VERSION}" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/changes.md
          if ! grep -q '[^[:space:]]' /tmp/changes.md; then
            echo "::error::CHANGELOG.md has no entries for ${VERSION}"
            exit 1
          fi
          {
            echo "## ical-aggregator ${VERSION}"
            echo
            cat /tmp/changes.md
            echo
            echo "### Installation"
            echo
            echo "On the server as root: \`/opt/ical-aggregator/scripts/update.sh ${VERSION}\`"
            echo "(or without version for the latest release)."
            echo "For a new install unpack \`ical-aggregator-${VERSION}.zip\` to \`/opt\`, copy"
            echo "\`config-sample.json\` to \`config.json\` and see README.md."
          } > release-notes.md
          cat release-notes.md

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          mkdir -p dist-zips staging/ical-aggregator
          # Runtime files only, node_modules is installed on the server (npm ci --omit=dev)
          cp -r server.js main.js modules package.json package-lock.json \
            config-sample.json systemd scripts README.md CHANGELOG.md \
            staging/ical-aggregator/
          chmod +x staging/ical-aggregator/scripts/*.sh
          cd staging
          zip -r "../dist-zips/ical-aggregator-${VERSION}.zip" ical-aggregator/

      # gh is preinstalled on the runner, no third-party action needed
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          gh release create "${VERSION}" "dist-zips/ical-aggregator-${VERSION}.zip" \
            --title "v${VERSION}" --notes-file release-notes.md --verify-tag
